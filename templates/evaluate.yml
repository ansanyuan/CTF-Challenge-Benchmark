spec:
  inputs:
    BASE_URL:
      default: "http://100.64.8.2:8000/v1"
      type: string
    MODEL_NAME:
      default: "HIVE0-36B-1029-sft"
      type: string
    API_KEY:
      default: "meow"
      type: string
    DATASETS_PATH:
      default: "rewards"
      type: string
    
---
variables:
  TAG_NAME: latest
evaluate:
  stage: evaluate
  image: "docker.cat/gitlab/ccb:$TAG_NAME"
  variables:
    TAG_NAME: ${CI_COMMIT_SHORT_SHA}
    MODEL_NAME: "HIVE0-36B-1029-sft"
    API_KEY: "meow"
    DATASETS_PATH: "rewards"
    BASE_URL: "http://100.64.8.2:8000/v1"
    MAX_CONCURRENT_REQUESTS: 100
  script:
    - ccb --datasets-path $DATASETS_PATH --model-name $MODEL_NAME --api-key $API_KEY --base-url $BASE_URL --max-concurrent-requests $MAX_CONCURRENT_REQUESTS
  artifacts:
    paths:
      - dump.json
