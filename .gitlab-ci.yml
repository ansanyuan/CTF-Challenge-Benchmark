spec:
  inputs:
    BASE_URL:
      default: "http://100.64.8.2:8000/v1"
      type: string
    MODEL_NAME:
      default: "HIVE0-36B-1029-sft"
      type: string
    API_KEY:
      default: "meow"
      type: string
    DATASETS_PATH:
      default: "rewards"
      type: string
      
---

include:
  - project: 'kxb/ci_template'
    ref: 'main'
    file: 'docker/docker.yml'
  - component: "$CI_SERVER_FQDN/$CI_PROJECT_PATH/evaluate@$CI_COMMIT_SHA"
    inputs:
      TAG_NAME: ${CI_COMMIT_SHORT_SHA}
      MODEL_NAME: $[[ inputs.MODEL_NAME ]]
      API_KEY: $[[ inputs.API_KEY ]]
      DATASETS_PATH: $[[ inputs.DATASETS_PATH ]]
      BASE_URL: $[[ inputs.BASE_URL ]]

stages:
  - build
  - evaluate

variables:
  # 必需变量
  REGISTRY_PROJECT_PATH: "gitlab/ccb"
  FINAL_IMAGE_NAME: "ccb"
  
  # 显式设置变量（一定要保留！模板中没有声明）
  REGISTRY: $Docker_CI_REGISTRY                   
  REGISTRY_USER: $Docker_CI_REGISTRY_USER         
  REGISTRY_PASSWORD: $Docker_CI_REGISTRY_PASSWORD 
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  REGISTRY_HOST_IP: "10.10.3.14"
  CACHE_REPO: "$Docker_CI_REGISTRY/$REGISTRY_PROJECT_PATH/cache"
  CI_RUNNER_TAGS: test-k8s